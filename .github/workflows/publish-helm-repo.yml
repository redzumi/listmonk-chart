# Build the Helm chart repository and deploy to GitHub Pages.
# Artifact Hub (and users) can add this repo at:
#   https://<owner>.github.io/<repo>
#
# Required: Repo Settings → Pages → Build and deployment → Source: "GitHub Actions"

name: Publish Helm repo

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"

      - name: Build Helm repo
        run: |
          REPO_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          mkdir -p repo
          helm package . --destination repo
          helm repo index repo --url "$REPO_URL"
          cp artifacthub-repo.yml repo/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: repo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Verify Helm repo
        run: |
          BASE="${{ steps.deploy.outputs.page_url }}"
          echo "Helm repo URL for Artifact Hub (use exactly this, no trailing slash):"
          echo "$BASE"
          echo ""
          HTTP=$(curl -sS -o /dev/null -w "%{http_code}" "$BASE/index.yaml")
          if [ "$HTTP" != "200" ]; then
            echo "::error::index.yaml returned HTTP $HTTP (expected 200). Artifact Hub will reject this URL."
            exit 1
          fi
          echo "✓ index.yaml is reachable (HTTP 200)"
          echo "Add this URL in Artifact Hub: $BASE"
